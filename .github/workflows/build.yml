name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Clean Flutter Android Project
        run: |
          rm -rf android app build .dart_tool build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p assets/images
          flutter create --platforms=android --org com.roldygoldy --project-name roldygoldy_ui .
          flutter pub get
          flutter analyze || true

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoldyGoldy-Flutter-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoldyGoldy-Flutter-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
