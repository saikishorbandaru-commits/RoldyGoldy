name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Application APK
        run: |
          flutter create --org com.roldygoldy roldygoldy_app
          cp lib/main.dart roldygoldy_app/lib/main.dart
          cd roldygoldy_app
          flutter build apk --debug
          cd ..
          mkdir -p build/app/outputs/flutter-apk
          cp roldygoldy_app/build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoldyGoldy-Flutter-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
